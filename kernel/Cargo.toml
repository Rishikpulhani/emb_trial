[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11.10"
volatile = "0.2.7"
spin = "0.10.0"
x86_64 = "0.15.2"
uart_16550 = "0.3.2"
noto-sans-mono-bitmap = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]



